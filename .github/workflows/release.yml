name: Release

# Roda quando uma tag "v*" é publicada: git tag v0.1.0 && git push --tags
# Gera os pacotes de cada SO e anexa tudo na Release do GitHub.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# GH_TOKEN autentica os downloads que o electron-builder faz do GitHub
# (Electron, NSIS, appimagetool, fpm…) — sem ele o rate-limit anônimo derrubava
# os dois jobs no meio do empacotamento (exit 1 sem mensagem clara).
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  linux:
    name: Linux (AppImage, deb, rpm, pacman, tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Um target por invocação: se um formato falhar (ex.: pacman), os demais
      # ainda são gerados e publicados — a release não morre inteira por um.
      - run: npx electron-builder --linux AppImage
      - run: npx electron-builder --linux deb
      - run: npx electron-builder --linux rpm
      - run: npx electron-builder --linux pacman
        continue-on-error: true
      - run: npx electron-builder --linux tar.gz

      - name: Publica pacotes Linux na Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.pacman
            release/*.tar.gz
          # Corpo explícito — sem notas automáticas (elas reproduziam as
          # mensagens de commit, incluindo trailers indesejados).
          body: |
            ## Unit Mail ${{ github.ref_name }}

            ⚠️ Versão **Beta** — em fase de testes. Reporte problemas em Issues.

            ### Pacotes para Linux

            | Formato | Distribuições |
            |---|---|
            | `.AppImage` | Qualquer distro (executável direto) |
            | `.deb` | Debian, Ubuntu, Mint e derivados |
            | `.rpm` | Fedora, RHEL, openSUSE |
            | `.pacman` | Arch e derivados |
            | `.tar.gz` | Portátil — descompactar e executar |

            ### Pacotes para Windows

            | Formato | Uso |
            |---|---|
            | `Unit-Mail-Setup-*.exe` | Instalador — recomendado |

            ### Instalação rápida

            ```bash
            # Fedora / RHEL / openSUSE
            sudo dnf install ./unit-mail-*.x86_64.rpm

            # Debian / Ubuntu
            sudo apt install ./unit-mail_*_amd64.deb
            ```

  windows:
    name: Windows (NSIS Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --x64

      - name: Publica executáveis Windows na Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          # Mesmo corpo do job Linux — o primeiro a terminar cria a Release,
          # e sem isso ela poderia nascer sem notas.
          body: |
            ## Unit Mail ${{ github.ref_name }}

            ⚠️ Versão **Beta** — em fase de testes. Reporte problemas em Issues.

            ### Pacotes para Linux

            | Formato | Distribuições |
            |---|---|
            | `.AppImage` | Qualquer distro (executável direto) |
            | `.deb` | Debian, Ubuntu, Mint e derivados |
            | `.rpm` | Fedora, RHEL, openSUSE |
            | `.pacman` | Arch e derivados |
            | `.tar.gz` | Portátil — descompactar e executar |

            ### Pacotes para Windows

            | Formato | Uso |
            |---|---|
            | `Unit-Mail-Setup-*.exe` | Instalador — recomendado |

            ### Instalação rápida

            ```bash
            # Fedora / RHEL / openSUSE
            sudo dnf install ./unit-mail-*.x86_64.rpm

            # Debian / Ubuntu
            sudo apt install ./unit-mail_*_amd64.deb
            ```
